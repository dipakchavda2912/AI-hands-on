[tool.black]
line-length = 88
target-version = ["py311"]
# Black is intentionally opinionated with limited options.

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
# Global settings
line-length = 88

[tool.ruff.lint]
# Start simple; expand as your team desires
select = ["E", "F", "B", "I", "UP"]      # pycodestyle, pyflakes, bugbear, isort, pyupgrade
ignore = ["E501"]                        # Example: ignore line-length if Black wraps

# You can also enable Ruff's formatter (experimental for some teams)
# [tool.ruff.format]
# quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
